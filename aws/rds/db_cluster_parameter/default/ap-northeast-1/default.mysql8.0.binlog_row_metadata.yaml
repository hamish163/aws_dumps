---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.mysql8.0.binlog_row_metadata
specifics:
  AllowedValues: FULL,MINIMAL
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: string
  Description: 'Controls whether metadata is logged using FULL or MINIMAL format.
    FULL causes all metadata to be logged; MINIMAL means that only metadata actually
    required by slave is logged. Default: MINIMAL.'
  IsModifiable: true
  ParameterName: binlog_row_metadata
  ParameterValue: MINIMAL
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

