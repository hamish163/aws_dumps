---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: mbx-bnb-solutions-telegrambot-postgres-cluster-pg.apg_write_forward.consistency_mode
specifics:
  AllowedValues: off,eventual,session,global
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: string
  Description: Control the degree of read consistency on a forwarding reader instance
    when using global write forwarding. Set apg_write_forward.consistency_mode to
    one of the allowed values to use write forwarding. For the definition of each
    allowed value, see the documentation on using write forwarding in an Amazon Aurora
    PostgreSQL DB cluster.
  IsModifiable: true
  ParameterName: apg_write_forward.consistency_mode
  ParameterValue: session
  Source: system
  SupportedEngineModes:
  - provisioned
...

