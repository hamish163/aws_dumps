---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: perf-dev57-mbx-klines-cluster-pgrp.slave_type_conversions
specifics:
  AllowedValues: ALL_LOSSY, ALL_NON_LOSSY
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: list
  Description: 'Set of slave type conversions that are enabled. Legal values are:
    ALL_LOSSY to enable lossy conversions and ALL_NON_LOSSY to enable non-lossy conversions.
    If the variable is assigned the empty set, no conversions are allowed and it is
    expected that the types match exactly.'
  IsModifiable: true
  ParameterName: slave_type_conversions
  Source: engine-default
  SupportedEngineModes:
  - provisioned
