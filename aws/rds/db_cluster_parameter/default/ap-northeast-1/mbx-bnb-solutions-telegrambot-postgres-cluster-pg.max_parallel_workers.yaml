---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: mbx-bnb-solutions-telegrambot-postgres-cluster-pg.max_parallel_workers
specifics:
  AllowedValues: 0-1024
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the maximum number of parallel workers than can be active at one
    time.
  IsModifiable: true
  ParameterName: max_parallel_workers
  ParameterValue: GREATEST(${DBInstanceVCPU/2},8)
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

