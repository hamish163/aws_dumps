---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.mysql8.0.slave_checkpoint_period
specifics:
  AllowedValues: 1-4294967295
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the maximum time (in milliseconds) that is allowed to pass before
    a checkpoint operation is called to update the status of a multi-threaded slave
    as shown by SHOW SLAVE STATUS.
  IsModifiable: true
  ParameterName: slave_checkpoint_period
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

