metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql17.aurora.logical_replication_backup
specifics:
  AllowedValues: 0,1
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: boolean
  Description: This setting controls if binary log data will be backed up or not.
    This setting is only used with aurora.enhanced_logical_replication. It must be
    disabled when aurora.enhanced_logical_replication is enabled, and enabled when
    aurora.enhanced_logical_replication is disabled.
