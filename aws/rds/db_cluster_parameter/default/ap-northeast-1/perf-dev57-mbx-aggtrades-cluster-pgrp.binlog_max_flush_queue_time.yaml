---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: perf-dev57-mbx-aggtrades-cluster-pgrp.binlog_max_flush_queue_time
specifics:
  AllowedValues: 0-100000
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: How long in microseconds to keep reading transactions from the flush
    queue before proceeding with the group commit (and syncing the log to disk, if
    sync_binlog is greater than 0). If the value is 0 (the default), there is no timeout
    and the server keeps reading new transactions until the queue is empty.
  IsModifiable: true
  ParameterName: binlog_max_flush_queue_time
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

