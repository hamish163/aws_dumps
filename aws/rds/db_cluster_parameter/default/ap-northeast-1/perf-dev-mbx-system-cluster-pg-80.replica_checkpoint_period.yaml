---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: perf-dev-mbx-system-cluster-pg-80.replica_checkpoint_period
specifics:
  AllowedValues: 1-4294967295
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the maximum time (in milliseconds) that is allowed to pass before
    a checkpoint operation is called to update the status of a multi-threaded replica
    as shown by SHOW REPLICA STATUS.
  IsModifiable: true
  ParameterName: replica_checkpoint_period
  Source: engine-default
  SupportedEngineModes:
  - provisioned
