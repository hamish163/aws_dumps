---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.mysql8.0.slave_transaction_retries
specifics:
  AllowedValues: 0-18446744073709551615
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: If a replication slave SQL thread fails to execute a transaction because
    of an InnoDB deadlock or because the transaction's execution time exceeded InnoDB's
    innodb_lock_wait_timeout, it automatically retries slave_transaction_retries times
    before stopping with an error.
  IsModifiable: true
  ParameterName: slave_transaction_retries
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

