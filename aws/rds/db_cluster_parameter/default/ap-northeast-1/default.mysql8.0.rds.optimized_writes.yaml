---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.mysql8.0.rds.optimized_writes
specifics:
  AllowedValues: AUTO,OFF
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: string
  Description: When the rds.optimized_writes parameter is set to AUTO, the DB instance
    uses RDS Optimized Writes for DB instance classes and engine versions that support
    it. When this parameter is set to OFF, the DB instance doesn't use RDS Optimized
    Writes.
  IsModifiable: true
  MinimumEngineVersion: 8.0.30
  ParameterName: rds.optimized_writes
  ParameterValue: AUTO
  Source: system
  SupportedEngineModes:
  - provisioned
...

