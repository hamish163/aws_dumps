---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: perf-dev-mbx-klines-cluster-pg-80.aurora_binlog_replication_sec_index_parallel_workers
specifics:
  AllowedValues: 0-1024
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the number of background threads used to apply DML changes to
    secondary indexes. This optimization can be used on binlog replicas to improve
    binary log replication performance for tables that contain a large number of secondary
    indexes. Setting this variable to 0 (the default) disables this feature.
  IsModifiable: true
  MinimumEngineVersion: 8.0.mysql_aurora.3.06.0
  ParameterName: aurora_binlog_replication_sec_index_parallel_workers
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

