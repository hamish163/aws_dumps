---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql17.apg_plan_mgmt.capture_plan_baselines
specifics:
  AllowedValues: manual,automatic,off
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: string
  Description: Capture plan baseline mode.  manual - enable plan capture for any SQL
    statement, off - disable plan capture, automatic - enable plan capture for for
    statements in pg_stat_statements that satisfy the eligibility criteria.
  IsModifiable: true
  ParameterName: apg_plan_mgmt.capture_plan_baselines
  ParameterValue: 'off'
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

