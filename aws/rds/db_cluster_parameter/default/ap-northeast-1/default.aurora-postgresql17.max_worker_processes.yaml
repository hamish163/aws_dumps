---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql17.max_worker_processes
specifics:
  AllowedValues: 0-262143
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: integer
  Description: Sets the maximum number of concurrent worker processes.
  IsModifiable: true
  ParameterName: max_worker_processes
  ParameterValue: GREATEST(${DBInstanceVCPU*2},8)
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

