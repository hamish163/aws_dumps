  region: ap-northeast-1
  resourceid: perf-dev-mbx-accounts-cluster-pg.innodb_compression_pad_pct_max
specifics:
  AllowedValues: 0-75
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Specifies the maximum percentage that can be reserved as free space
    within each compressed page, allowing room to reorganize the data and modification
    log within the page when a compressed table or index is updated and the data might
    be recompressed.
  IsModifiable: true
  ParameterName: innodb_compression_pad_pct_max
  Source: engine-default
  SupportedEngineModes:
  - provisioned
