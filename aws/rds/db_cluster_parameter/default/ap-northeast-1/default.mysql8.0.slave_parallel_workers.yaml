---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.mysql8.0.slave_parallel_workers
specifics:
  AllowedValues: 0-1024
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the number of slave applier threads for executing replication
    transactions in parallel.
  IsModifiable: true
  ParameterName: slave_parallel_workers
  ParameterValue: LEAST({DBInstanceVCPU*8}, 128)
  Source: system
  SupportedEngineModes:
  - provisioned
...

