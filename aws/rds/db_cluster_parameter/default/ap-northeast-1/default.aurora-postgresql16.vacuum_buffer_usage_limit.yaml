---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql16.vacuum_buffer_usage_limit
specifics:
  AllowedValues: 0-16777216
  ApplyMethod: pending-reboot
  ApplyType: dynamic
  DataType: integer
  Description: Sets the buffer pool size for VACUUM, ANALYZE, and autovacuum.
  IsModifiable: true
  ParameterName: vacuum_buffer_usage_limit
  ParameterValue: GREATEST({DBInstanceClassMemory/4000000},65536)
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

