---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql16.aurora.logical_replication_globaldb
specifics:
  AllowedValues: 0,1
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: boolean
  Description: This setting controls if binary log data will be replicated to global
    database secondary clusters. This setting is only used with aurora.enhanced_logical_replication.  It
    must be disabled when aurora.enhanced_logical_replication is enabled, and enabled
    when aurora.enhanced_logical_replication is disabled.
  IsModifiable: true
  MinimumEngineVersion: '16.4'
  ParameterName: aurora.logical_replication_globaldb
  ParameterValue: '1'
  Source: system
  SupportedEngineModes:
  - provisioned
...

