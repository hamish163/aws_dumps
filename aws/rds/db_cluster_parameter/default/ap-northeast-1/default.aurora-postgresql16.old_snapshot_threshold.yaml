---
datatype: aws.rds.db_cluster_parameter
metadata:
  profile: default
  region: ap-northeast-1
  resourceid: default.aurora-postgresql16.old_snapshot_threshold
specifics:
  AllowedValues: -1-86400
  ApplyMethod: pending-reboot
  ApplyType: static
  DataType: integer
  Description: (min) Time before a snapshot is too old to read pages changed after
    the snapshot was taken.
  IsModifiable: true
  ParameterName: old_snapshot_threshold
  Source: engine-default
  SupportedEngineModes:
  - provisioned
...

